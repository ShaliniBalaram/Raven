[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-geomatics"
version = "0.1.0"
description = "Geomatics toolkit for reproducible DEM conditioning, stream extraction, basin delineation, and reach graph analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shalini Balaram"}]
dependencies = [
  "click>=8.1",
  "geopandas>=0.14",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "pillow>=10.0",
  "pyflwdir>=0.5",
  "pyproj>=3.6",
  "pysheds>=0.3",
  "pyyaml>=6.0",
  "rasterio>=1.3",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
whitebox = ["whitebox>=2.3"]

[project.scripts]
raven = "raven.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
